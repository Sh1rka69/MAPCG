name: Build MAPCG APK

on:
push:
paths:
- "*.zip"
- ".github/workflows/build-apk.yml"
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v5

  - name: Find MAPCG ZIP
    id: zip
    shell: bash
    run: |
      set -e

      ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: MAPCG ZIP was not found in repository root."
        exit 1
      fi

      echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"
      echo "Using: $ZIP_FILE"

  - name: Prepare project
    shell: bash
    run: |
      set -e

      mkdir -p build-source

      unzip -q "${{ steps.zip.outputs.ZIP_FILE }}" -d build-source

      echo "ZIP extracted."

      # Remove a possible single top-level directory.
      shopt -s dotglob nullglob
      entries=(build-source/*)

      if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
        inner="${entries[0]}"
        mkdir -p build-source-flat
        cp -a "$inner"/. build-source-flat/
        rm -rf build-source
        mv build-source-flat build-source
      fi

      echo "Project contents:"
      ls -la build-source

  - name: Verify Android project
    shell: bash
    run: |
      set -e

      if [ ! -d "build-source/android" ]; then
        echo "ERROR: android/ directory was not found."
        echo "The ZIP must contain the MAPCG Android project."
        exit 1
      fi

      if [ ! -f "build-source/android/settings.gradle.kts" ]; then
        echo "ERROR: settings.gradle.kts was not found."
        exit 1
      fi

      if [ ! -f "build-source/android/app/build.gradle.kts" ]; then
        echo "ERROR: app/build.gradle.kts was not found."
        exit 1
      fi

  - name: Set up JDK 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Make Gradle executable
    shell: bash
    run: |
      chmod +x build-source/android/gradlew

  - name: Build release APK
    working-directory: build-source/android
    shell: bash
    run: |
      ./gradlew --no-daemon --stacktrace assembleRelease

  - name: Locate APK
    id: apk
    shell: bash
    run: |
      set -e

      APK="$(find build-source/android -type f -name '*-release.apk' | head -n 1)"

      if [ -z "$APK" ]; then
        echo "ERROR: Release APK was not found."
        exit 1
      fi

      echo "APK=$APK" >> "$GITHUB_OUTPUT"
      echo "Found: $APK"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MAPCG-APK
      path: ${{ steps.apk.outputs.APK }}
      if-no-files-found: error
      retention-days: 7
