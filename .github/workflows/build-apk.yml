name: Build MAPCG APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted

      - name: Find Android project
        run: |
          if [ -d "extracted/android" ]; then
            echo "ANDROID_DIR=extracted/android" >> "$GITHUB_ENV"
          else
            ANDROID_DIR=$(find extracted -type f -name "settings.gradle.kts" -printf "%h\n" | head -n 1)
            if [ -z "$ANDROID_DIR" ]; then
              echo "Android project not found"
              exit 1
            fi
            echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAPCG-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
